<!doctype html>
<html lang="en">
<head>
<title>Mains Timer – UPSC Hub</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1428">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.page{max-width:600px;margin:0 auto;padding:1.5rem 1rem}
h2{font-family:'Instrument Serif',serif;font-size:1.6rem;font-weight:400;margin:0 0 1.25rem}
.setup-info{font-size:.85rem;color:var(--fg-muted);margin-bottom:1.25rem}
.q-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:.6rem .75rem}
.q-num{font-size:.72rem;font-weight:700;color:var(--accent);min-width:28px}
.q-marks-select{flex:1}
.q-remove{background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:1rem;padding:2px 4px;border-radius:4px;line-height:1}
.q-remove:hover{color:#e44}
.add-row{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.marks-btn{padding:7px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;background:var(--bg-card);color:var(--fg-muted);font-family:inherit}
.marks-btn:hover{border-color:var(--accent);color:var(--accent)}
/* Running timer */
.running{text-align:center;padding:2rem 1rem}
.r-q-label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:.5rem}
.r-stage{font-size:.85rem;font-weight:600;color:var(--accent);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.06em}
.r-clock{font-family:'Instrument Serif',serif;font-size:5rem;line-height:1;color:var(--fg);margin-bottom:.5rem;font-variant-numeric:tabular-nums}
.r-clock.warning{color:#e44;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.r-progress{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.r-seg{height:6px;border-radius:3px;flex:1;min-width:16px;max-width:50px;background:var(--border);transition:background .3s}
.r-seg.done{background:var(--accent)}
.r-seg.active{background:var(--gold)}
.r-qs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.r-q-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--bg-card);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--fg-muted);cursor:pointer}
.r-q-dot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.r-q-dot.active{background:var(--gold);border-color:var(--gold);color:#fff}
.controls{display:flex;gap:.75rem;justify-content:center}
.stages-list{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.stage-pill{padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600;background:var(--border);color:var(--fg-muted)}
.stage-pill.done{background:var(--accent-bg);color:var(--accent)}
.stage-pill.active{background:var(--gold-bg);color:var(--gold)}
.r-next{font-size:.8rem;color:var(--fg-muted);margin-top:1rem}
</style>
</head>
<body>
<nav class="nav">
  <a href="../index.html" class="nav-back">← UPSC Hub</a>
  <span class="nav-title">Mains Timer</span>
</nav>

<div class="page" id="setup">
  <h2>Set up your paper</h2>
  <p class="setup-info">Add questions and their marks. The timer allocates time for brainstorming, intro, body and conclusion.</p>
  <div id="q-list"></div>
  <div class="add-row">
    <span style="font-size:.8rem;color:var(--fg-muted);align-self:center">Add question:</span>
    <button class="marks-btn" onclick="addQ(5)">5m</button>
    <button class="marks-btn" onclick="addQ(10)">10m</button>
    <button class="marks-btn" onclick="addQ(15)">15m</button>
    <button class="marks-btn" onclick="addQ(20)">20m</button>
  </div>
  <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-top:1rem">
    <button class="btn btn-primary" id="start-btn" onclick="start()" style="display:none">Start timer →</button>
    <span id="total-time" style="font-size:.85rem;color:var(--fg-muted)"></span>
  </div>
</div>

<div class="page" id="running" hidden>
  <div class="running">
    <div class="r-qs" id="r-qs"></div>
    <div class="r-q-label" id="r-q-label"></div>
    <div class="stages-list" id="stages-list"></div>
    <div class="r-stage" id="r-stage"></div>
    <div class="r-clock" id="r-clock">00:00</div>
    <div class="r-progress" id="r-progress"></div>
    <div class="controls">
      <button class="btn btn-ghost" id="skip-btn" onclick="skipStage()">Skip stage</button>
      <button class="btn btn-primary" id="pause-btn" onclick="togglePause()">Pause</button>
      <button class="btn btn-ghost" onclick="reset()">Reset</button>
    </div>
    <div class="r-next" id="r-next"></div>
  </div>
</div>

<script>
const STAGES = {
  5:  [{n:'Brainstorm',s:60},{n:'Intro',s:40},{n:'Body',s:120},{n:'Conclusion',s:40}],
  10: [{n:'Brainstorm',s:60},{n:'Intro',s:60},{n:'Body',s:270},{n:'Conclusion',s:60}],
  15: [{n:'Brainstorm',s:70},{n:'Intro',s:70},{n:'Body',s:440},{n:'Conclusion',s:70}],
  20: [{n:'Brainstorm',s:80},{n:'Intro',s:90},{n:'Body',s:600},{n:'Conclusion',s:90}],
};

let qs = [];
let timer = null, paused = false;
let curQ = 0, curStage = 0, remaining = 0;
let started = false;

function addQ(marks) {
  qs.push(marks);
  renderSetup();
}

function removeQ(i) {
  qs.splice(i, 1);
  renderSetup();
}

function renderSetup() {
  const list = document.getElementById('q-list');
  list.innerHTML = qs.map((m, i) => `
    <div class="q-row">
      <span class="q-num">Q${i+1}</span>
      <span style="font-size:.85rem;font-weight:600;color:var(--fg)">${m} marks</span>
      <span style="font-size:.78rem;color:var(--fg-muted);flex:1;padding-left:.5rem">${fmtSecs(totalForQ(m))}</span>
      <button class="q-remove" onclick="removeQ(${i})">✕</button>
    </div>`).join('');

  const total = qs.reduce((s, m) => s + totalForQ(m), 0);
  document.getElementById('total-time').textContent = qs.length ? `Total: ${fmtSecs(total)} for ${qs.length} question${qs.length>1?'s':''}` : '';
  document.getElementById('start-btn').style.display = qs.length ? '' : 'none';
}

function totalForQ(marks) {
  return (STAGES[marks] || STAGES[10]).reduce((s, st) => s + st.s, 0);
}

function fmtSecs(s) {
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function start() {
  if (!qs.length) return;
  curQ = 0; curStage = 0; paused = false; started = true;
  document.getElementById('setup').hidden = true;
  document.getElementById('running').hidden = false;
  loadStage();
}

function loadStage() {
  if (curQ >= qs.length) { done(); return; }
  const marks = qs[curQ];
  const stages = STAGES[marks] || STAGES[10];
  if (curStage >= stages.length) {
    curQ++; curStage = 0;
    loadStage(); return;
  }
  remaining = stages[curStage].s;
  updateDisplay();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
}

function tick() {
  if (paused) return;
  remaining--;
  updateDisplay();
  if (remaining <= 0) {
    beep();
    clearInterval(timer);
    curStage++;
    loadStage();
  }
}

function updateDisplay() {
  const marks = qs[curQ];
  const stages = STAGES[marks] || STAGES[10];
  const st = stages[curStage];
  if (!st) return;

  document.getElementById('r-q-label').textContent = `Question ${curQ+1} of ${qs.length} · ${marks} marks`;
  document.getElementById('r-stage').textContent = st.n;
  const c = document.getElementById('r-clock');
  c.textContent = fmtSecs(remaining);
  c.className = 'r-clock' + (remaining <= 10 ? ' warning' : '');

  // Q dots
  document.getElementById('r-qs').innerHTML = qs.map((m, i) =>
    `<div class="r-q-dot ${i < curQ ? 'done' : i === curQ ? 'active' : ''}">${i+1}</div>`).join('');

  // Stages pills
  document.getElementById('stages-list').innerHTML = stages.map((s, i) =>
    `<span class="stage-pill ${i < curStage ? 'done' : i === curStage ? 'active' : ''}">${s.n}</span>`).join('');

  // Progress segments for current question
  document.getElementById('r-progress').innerHTML = stages.map((s, i) =>
    `<div class="r-seg ${i < curStage ? 'done' : i === curStage ? 'active' : ''}" style="flex:${s.s}"></div>`).join('');

  // Next info
  const nextStage = stages[curStage+1];
  const nextQ = !nextStage && curQ+1 < qs.length;
  if (nextStage) document.getElementById('r-next').textContent = `Next: ${nextStage.n} (${fmtSecs(nextStage.s)})`;
  else if (nextQ) document.getElementById('r-next').textContent = `Next: Question ${curQ+2} of ${qs.length}`;
  else document.getElementById('r-next').textContent = '';
}

function skipStage() {
  clearInterval(timer);
  beep();
  curStage++;
  loadStage();
}

function togglePause() {
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
}

function reset() {
  clearInterval(timer);
  document.getElementById('running').hidden = true;
  document.getElementById('setup').hidden = false;
  paused = false; started = false;
}

function done() {
  clearInterval(timer);
  document.getElementById('r-clock').textContent = '✓';
  document.getElementById('r-stage').textContent = 'Paper complete!';
  document.getElementById('r-q-label').textContent = `All ${qs.length} questions done`;
  document.getElementById('r-progress').innerHTML = '';
  document.getElementById('r-next').textContent = '';
  document.getElementById('skip-btn').disabled = true;
  document.getElementById('pause-btn').disabled = true;
  beep(); setTimeout(beep, 400); setTimeout(beep, 800);
}

let audioCtx;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .4);
    o.start(); o.stop(audioCtx.currentTime + .4);
  } catch(e) {}
}

renderSetup();
</script>
</body>
</html>
