<!doctype html>
<html lang="en">
<head>
<title>Current Affairs – UPSC Hub</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1428">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.toolbar{padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;border-bottom:1px solid var(--border);background:var(--bg-card);position:sticky;top:52px;z-index:50}
.search-wrap{flex:1;min-width:140px}
.list{max-width:900px;margin:0 auto;padding:1rem}
.ca-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem}
.ca-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column}
.ca-card:hover{box-shadow:0 2px 14px rgba(0,0,0,.08);border-color:var(--accent)}
.ca-img{width:100%;height:140px;object-fit:cover;flex-shrink:0}
.ca-img-placeholder{height:140px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:2rem}
.ca-body{padding:.85rem;flex:1}
.ca-meta{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.ca-src{font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--accent-bg);color:var(--accent)}
.ca-date{font-size:.65rem;color:var(--fg-muted)}
.ca-subject{font-size:.62rem;font-weight:600;color:var(--gold);background:var(--gold-bg);padding:2px 6px;border-radius:4px}
.ca-title{font-size:.9rem;font-weight:600;color:var(--fg);line-height:1.4;margin-bottom:.35rem}
.ca-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:.4rem}
.ca-tag{font-size:.6rem;padding:1px 6px;border-radius:100px;background:var(--border);color:var(--fg-muted)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-bg[hidden]{display:none}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;max-width:720px;width:100%;margin:auto;overflow:hidden}
.modal-img{width:100%;height:200px;object-fit:cover}
.modal-body{padding:1.5rem 2rem}
@media(max-width:600px){.modal-body{padding:1rem}}
.modal-src-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.modal-title{font-family:'Instrument Serif',serif;font-size:1.5rem;font-weight:400;line-height:1.3;margin:0 0 .5rem}
.modal-close{position:absolute;top:1rem;right:1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.modal-wrap{position:relative}
.ca-content{font-size:.88rem;line-height:1.75;color:var(--fg)}
.ca-content h3{font-size:1rem;font-weight:700;color:var(--fg);margin:1rem 0 .4rem}
.ca-content p{margin:.5rem 0}
.ca-content mark{background:rgba(255,210,50,.35);border-radius:2px;padding:0 1px}
.ca-content strong{font-weight:700}
.ca-orig-link{display:inline-flex;align-items:center;gap:5px;margin-top:.75rem;font-size:.8rem;color:var(--accent);text-decoration:none}
.ca-orig-link:hover{text-decoration:underline}
.count-line{font-size:.75rem;color:var(--fg-muted);margin-bottom:.75rem}
</style>
</head>
<body>
<nav class="nav">
  <a href="../index.html" class="nav-back">← UPSC Hub</a>
  <span class="nav-title">Current Affairs</span>
</nav>

<div id="loading" class="loading"><div class="spinner"></div><span>Loading Current Affairs…</span></div>

<div id="app" hidden>
  <div class="toolbar">
    <div class="search-wrap"><input class="search" id="q" placeholder="Search articles…" autocomplete="off"></div>
    <select id="subj"><option value="">All subjects</option></select>
    <select id="src"><option value="">All sources</option></select>
  </div>
  <div class="list">
    <div class="count-line" id="count"></div>
    <div class="ca-grid" id="grid"></div>
  </div>
</div>

<div class="modal-bg" id="modal-bg" hidden onclick="closeModal(event)">
  <div class="modal modal-wrap" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
let D = null, all = [];

async function init() {
  try {
    const r = await fetch('https://upsckata.com/data/ca.json');
    D = await r.json();
    all = Object.values(D.docs || {});
    all.sort((a,b) => (b.d||'').localeCompare(a.d||''));

    const subjects = [...new Set(all.map(d=>d.s).filter(Boolean))].sort();
    const sources  = [...new Set(all.map(d=>d.src).filter(Boolean))].sort();
    const sbjEl = document.getElementById('subj');
    const srcEl = document.getElementById('src');
    subjects.forEach(s => { const o=document.createElement('option'); o.value=o.textContent=s; sbjEl.appendChild(o); });
    sources.forEach(s  => { const o=document.createElement('option'); o.value=o.textContent=s; srcEl.appendChild(o); });

    document.getElementById('loading').hidden = true;
    document.getElementById('app').hidden = false;
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div class="empty">Failed to load. Check your connection.</div>';
  }
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const subj = document.getElementById('subj').value;
  const src = document.getElementById('src').value;

  let items = all;
  if (q) items = items.filter(d =>
    (d.t||'').toLowerCase().includes(q) ||
    (d.tg||[]).join(' ').toLowerCase().includes(q) ||
    (d.s||'').toLowerCase().includes(q)
  );
  if (subj) items = items.filter(d => d.s === subj);
  if (src) items = items.filter(d => d.src === src);

  document.getElementById('count').textContent = `${items.length} article${items.length!==1?'s':''}`;

  const grid = document.getElementById('grid');
  if (!items.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No articles match.</div>'; return; }

  grid.innerHTML = items.map((d,i) => `
    <div class="ca-card" onclick="openDoc(${all.indexOf(d)})">
      ${d.img ? `<img class="ca-img" src="${d.img}" alt="" loading="lazy" onerror="this.className='ca-img-placeholder';this.innerHTML='📰'">` : `<div class="ca-img-placeholder">📰</div>`}
      <div class="ca-body">
        <div class="ca-meta">
          ${d.src ? `<span class="ca-src">${esc(d.src)}</span>` : ''}
          ${d.d ? `<span class="ca-date">${d.d}</span>` : ''}
          ${d.s ? `<span class="ca-subject">${esc(d.s)}</span>` : ''}
        </div>
        <div class="ca-title">${esc(d.t||'')}</div>
        ${d.tg && d.tg.length ? `<div class="ca-tags">${d.tg.map(t=>`<span class="ca-tag">${esc(t)}</span>`).join('')}</div>` : ''}
      </div>
    </div>`).join('');
}

function openDoc(idx) {
  const d = all[idx];
  if (!d) return;
  let html = '';
  if (d.img) html += `<img class="modal-img" src="${d.img}" alt="">`;
  html += `<div class="modal-body">
    <div class="modal-src-row">
      ${d.src ? `<span class="ca-src">${esc(d.src)}</span>` : ''}
      ${d.d ? `<span class="ca-date" style="color:var(--fg-muted);font-size:.78rem">${d.d}</span>` : ''}
      ${d.s ? `<span class="ca-subject">${esc(d.s)}</span>` : ''}
    </div>
    <h2 class="modal-title">${esc(d.t||'')}</h2>
    ${d.tg && d.tg.length ? `<div class="ca-tags" style="margin-bottom:.75rem">${d.tg.map(t=>`<span class="ca-tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="ca-content">${renderContent(d.x||[])}</div>
    ${d.u ? `<a class="ca-orig-link" href="${d.u}" target="_blank" rel="noopener">Read original article ↗</a>` : ''}
  </div>`;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-bg').hidden = false;
  document.body.style.overflow = 'hidden';
}

function renderContent(sections) {
  return sections.map(sec => {
    let out = '';
    if (sec.h) out += `<h3>${esc(sec.h)}</h3>`;
    if (sec.md) out += `<p>${renderMd(sec.md)}</p>`;
    return out;
  }).join('');
}

function renderMd(text) {
  return esc(text)
    .replace(/==(.+?)==/g, '<mark>$1</mark>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-bg')) return;
  document.getElementById('modal-bg').hidden = true;
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('q').addEventListener('input', render);
document.getElementById('subj').addEventListener('change', render);
document.getElementById('src').addEventListener('change', render);

init();
</script>
</body>
</html>
